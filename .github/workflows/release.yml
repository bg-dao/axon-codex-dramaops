name: macOS pre-release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: go test -race ./...
      - run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -nopackage -m -platform darwin/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: SceneOps-macos-arm64-unsigned-prerelease
          path: build/bin/SceneOps
