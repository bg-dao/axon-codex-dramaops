name: Feature request
description: Propose a focused creator workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: creator_problem
    attributes:
      label: Creator problem
      description: Describe the workflow problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: v0.1 boundaries
      options:
        - label: This does not require cloud sync or multi-user collaboration.
        - label: This preserves provider-neutral project schemas.
