name: Bug report
description: Report a reproducible DramaOps problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using non-sensitive sample data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DramaOps and Codex versions
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Project storage, Script and Fountain, Shot planning, Codex harness, Image consistency, Video, Voice and sound, Timeline and render, MCP, Desktop UI, Packaging]
