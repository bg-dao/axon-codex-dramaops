name: Bug report
description: Report a reproducible SceneOps problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using non-sensitive sample data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SceneOps and Codex versions
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Project storage, Codex harness, Image generation, Video generation, MCP, Desktop UI, Packaging]
